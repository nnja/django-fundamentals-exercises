[project]
name = "rescuescout"
version = "0.1.0"
description = "An animal rescue site: animals, adoption applications, an admin, and an API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "djlint~=1.46.4",
    "pytest~=9.1.1",
    "pytest-django~=4.14.0",
    "ruff~=0.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
