{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}RescueScout{% endblock %}</title>
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
  </head>
  <body>
    <header>
      <nav>
        <a href="{% url 'animals:list' %}">Home</a>
      </nav>
    </header>
    <main>
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
